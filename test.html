<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0052a3;
        }
        .button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        .link-button {
            background: none;
            border: none;
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: 1em;
        }
        .link-button:hover {
            color: #0052a3;
        }
        .link-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .menu-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px 0;
        }
        .menu-button:hover {
            background-color: #0052a3;
        }
        .menu-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        nav a {
            display: block;
            padding: 10px;
            color: #0066cc;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #f0f0f0;
        }
        nav a:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing a 300 by 200 pixel gray rectangle" />
        </div>
        
        <!-- Fixed: Form with proper labels -->
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" />
            
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Fixed: Button with accessible text -->
        <div>
            <button class="button" id="confirmBtn" aria-label="Confirm">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #767676;">This text now has sufficient contrast (4.54:1)</p>
        
        <!-- Fixed: Proper heading structure -->
        <div>
            <h2>This is now a proper heading</h2>
        </div>
        
        <!-- Fixed: ARIA labels and semantic navigation -->
        <div>
            <a href="/checkout">Home</a>
            <button class="menu-button" id="menuToggle" aria-expanded="false" aria-controls="menu" aria-haspopup="true">Menu</button>
            <nav id="menu" style="display: none;" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        
        <!-- Fixed: Semantic HTML with proper button -->
        <button class="link-button" id="clickableBtn">
            Click me (now I'm a proper button)
        </button>
    </div>

    <script>
        // Fixed: Using addEventListener instead of inline handlers
        document.getElementById('confirmBtn').addEventListener('click', function() {
            alert('Clicked');
        });
        
        document.getElementById('clickableBtn').addEventListener('click', function() {
            alert('Clicked!');
        });
        
        // Fixed: Toggle menu with proper ARIA state management and focus handling
        document.getElementById('menuToggle').addEventListener('click', function() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menuToggle');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            button.setAttribute('aria-expanded', !isExpanded);
            
            // Focus management: move focus to first link when opening
            if (!isExpanded) {
                const firstLink = menu.querySelector('a');
                if (firstLink) {
                    firstLink.focus();
                }
            }
        });
        
        // Handle Escape key to close menu
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const menu = document.getElementById('menu');
                const button = document.getElementById('menuToggle');
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                
                if (isExpanded) {
                    menu.style.display = 'none';
                    button.setAttribute('aria-expanded', 'false');
                    button.focus();
                }
            }
        });
    </script>
</body>
</html>
