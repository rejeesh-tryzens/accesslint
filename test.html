<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0052a3;
        }
        .button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .link-button {
            background: none;
            border: none;
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: inherit;
        }
        .link-button:hover {
            color: #0052a3;
        }
        .link-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        input[type="submit"] {
            margin-top: 15px;
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
        }
        input[type="submit"]:hover {
            background-color: #0052a3;
        }
        input[type="submit"]:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        #menu {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        #menu a {
            display: block;
            padding: 8px;
            color: #0066cc;
            text-decoration: none;
        }
        #menu a:hover {
            background-color: #e9e9e9;
        }
        #menu a:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .menu-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .menu-button:hover {
            background-color: #0052a3;
        }
        .menu-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accessibility Test Page</h1>
        
        <!-- Image with alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing 300 by 200 pixel dimensions" />
        </div>
        
        <!-- Form with proper labels -->
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />
            
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Button with accessible text -->
        <div>
            <button class="button" id="confirmBtn" aria-label="Confirm action">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Improved color contrast -->
        <p style="color: #767676;">This text has better contrast</p>
        
        <!-- Proper heading structure -->
        <div>
            <h2>This is now a proper heading</h2>
        </div>
        
        <!-- Menu with ARIA labels -->
        <div>
            <button class="menu-button" id="menuBtn" aria-expanded="false" aria-controls="menu" aria-haspopup="true">Menu</button>
            <nav id="menu" style="display: none;" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        
        <!-- Semantic HTML button -->
        <button id="clickableBtn" class="link-button">
            Click me (now I'm a proper button)
        </button>
    </div>

    <script>
        // Confirm button event listener
        document.getElementById('confirmBtn').addEventListener('click', function() {
            alert('Clicked');
        });
        
        // Menu toggle with ARIA and focus management
        document.getElementById('menuBtn').addEventListener('click', function() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menuBtn');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            if (isExpanded) {
                menu.style.display = 'none';
                button.setAttribute('aria-expanded', 'false');
            } else {
                menu.style.display = 'block';
                button.setAttribute('aria-expanded', 'true');
                // Move focus to first menu item
                const firstLink = menu.querySelector('a');
                if (firstLink) firstLink.focus();
            }
        });
        
        // Clickable button event listener
        document.getElementById('clickableBtn').addEventListener('click', function() {
            alert('Clicked!');
        });
    </script>
</body>
</html>
