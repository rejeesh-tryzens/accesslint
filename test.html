<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        .custom-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        nav {
            margin: 20px 0;
        }
        #menu {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        #menu a {
            display: block;
            padding: 8px;
            text-decoration: none;
            color: #0066cc;
        }
        #menu a:hover,
        #menu a:focus {
            background-color: #e6f2ff;
            outline: 2px solid #0066cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing 300 by 200 pixel dimensions" />
        </div>
        
        <!-- Fixed: Form with proper labels -->
        <form>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" />
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" />
            
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Fixed: Button with accessible text and aria-label -->
        <div>
            <button class="button" onclick="alert('Clicked')" aria-label="Confirm selection">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #767676;">This text now has sufficient contrast</p>
        
        <!-- Fixed: Proper heading structure -->
        <div>
            <h2>This is now a proper heading</h2>
        </div>
        
        <!-- Fixed: ARIA labels for menu and corrected link text -->
        <nav>
            <a href="/">Home</a>
            <button onclick="toggleMenu()" aria-expanded="false" aria-controls="menu" aria-haspopup="true">Menu</button>
            <div id="menu" role="menu" style="display: none;">
                <a href="#home" role="menuitem">Home</a>
                <a href="#about" role="menuitem">About</a>
                <a href="#contact" role="menuitem">Contact</a>
            </div>
        </nav>
        
        <!-- Fixed: Semantic HTML with button element -->
        <button onclick="handleClick()" class="custom-button">
            Click me (now I'm a proper button)
        </button>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.querySelector('[aria-controls="menu"]');
            const isExpanded = menu.style.display !== 'none';
            
            if (isExpanded) {
                menu.style.display = 'none';
                button.setAttribute('aria-expanded', 'false');
                button.focus();
            } else {
                menu.style.display = 'block';
                button.setAttribute('aria-expanded', 'true');
                const firstMenuItem = menu.querySelector('a');
                if (firstMenuItem) firstMenuItem.focus();
            }
        }
        
        function handleClick() {
            alert('Clicked!');
        }
    </script>
</body>
</html>
