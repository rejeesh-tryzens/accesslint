<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0052a3;
        }
        .button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        .clickable-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .clickable-button:hover {
            background-color: #0052a3;
        }
        .clickable-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .menu-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .menu-button:hover {
            background-color: #0052a3;
        }
        .menu-button:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        #menu {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        #menu a {
            display: block;
            padding: 8px;
            color: #0066cc;
            text-decoration: none;
        }
        #menu a:hover {
            background-color: #e9e9e9;
        }
        #menu a:focus {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <h1>Accessibility Test Page</h1>
            
            <!-- Fixed: Added alt text -->
            <div class="image-container">
                <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing 300 by 200 pixel dimensions" />
            </div>
            
            <!-- Fixed: Added proper labels -->
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Username" />
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" />
                
                <input type="submit" value="Submit" />
            </form>
            
            <!-- Fixed: Added aria-label and type attribute, removed inline onclick -->
            <div>
                <button type="button" class="button" id="confirmButton" aria-label="Confirm action">
                    <span class="icon" aria-hidden="true">✓</span>
                </button>
            </div>
            
            <!-- Fixed: Improved color contrast -->
            <p style="color: #767676;">This text has sufficient contrast</p>
            
            <!-- Fixed: Used proper heading element -->
            <div>
                <h2>This is a proper heading</h2>
            </div>
            
            <!-- Fixed: Added ARIA attributes and semantic nav element -->
            <div>
                <button type="button" class="menu-button" id="menuButton" aria-expanded="false" aria-controls="menu" aria-haspopup="true">Menu</button>
                <nav id="menu" style="display: none;" role="navigation">
                    <a href="#home">Home</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
            </div>
            
            <!-- Fixed: Replaced div with semantic button element -->
            <button type="button" class="clickable-button" id="clickableButton">Click me</button>
        </div>
    </main>

    <script>
        // Fixed: Moved event handlers to external JavaScript
        document.getElementById('confirmButton').addEventListener('click', function() {
            alert('Clicked');
        });
        
        document.getElementById('menuButton').addEventListener('click', function() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menuButton');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            button.setAttribute('aria-expanded', !isExpanded);
        });
        
        document.getElementById('clickableButton').addEventListener('click', function() {
            alert('Clicked!');
        });
    </script>
</body>
</html>
