<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 4px;
        }
        legend {
            font-weight: bold;
            padding: 0 10px;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        .clickable-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="container" id="main-content">
        <h1>Accessibility Test Page</h1>
        
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing a 300 by 200 pixel gray rectangle" />
        </div>
        
        <form>
            <fieldset>
                <legend>User Registration</legend>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Username" required aria-required="true" />
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required aria-required="true" />
                
                <input type="submit" value="Submit" />
            </fieldset>
        </form>
        
        <div>
            <button class="button" id="confirm-btn" aria-label="Confirm selection">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <p style="color: #595959;">This text has excellent contrast</p>
        
        <div>
            <h2>This is a proper heading</h2>
        </div>
        
        <div>
            <button id="menu-toggle" aria-expanded="false" aria-controls="menu" aria-label="Toggle navigation menu">Menu</button>
            <nav id="menu" style="display: none;" aria-hidden="true" role="navigation">
                <a href="#home" aria-current="page">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        
        <button id="click-me-btn" class="clickable-button">
            Click me
        </button>
        
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to the home section.</p>
        </section>
        
        <section id="about">
            <h2>About</h2>
            <p>Information about this page.</p>
        </section>
        
        <section id="contact">
            <h2>Contact</h2>
            <p>Contact information goes here.</p>
        </section>
    </main>
    
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menu-toggle');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            menu.setAttribute('aria-hidden', isExpanded);
            button.setAttribute('aria-expanded', !isExpanded);
            
            // Focus management
            if (!isExpanded) {
                const firstLink = menu.querySelector('a');
                if (firstLink) {
                    firstLink.focus();
                }
            }
        }
        
        function handleMenuKeydown(event) {
            if (event.key === 'Escape') {
                const button = document.getElementById('menu-toggle');
                const menu = document.getElementById('menu');
                menu.style.display = 'none';
                menu.setAttribute('aria-hidden', 'true');
                button.setAttribute('aria-expanded', 'false');
                button.focus();
            }
        }
        
        function handleClick() {
            alert('Clicked!');
        }
        
        // Event listeners
        document.getElementById('menu-toggle').addEventListener('click', toggleMenu);
        document.getElementById('menu').addEventListener('keydown', handleMenuKeydown);
        document.getElementById('confirm-btn').addEventListener('click', function() {
            alert('Clicked');
        });
        document.getElementById('click-me-btn').addEventListener('click', handleClick);
    </script>
</body>
</html>
