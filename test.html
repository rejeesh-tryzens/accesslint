<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button:focus,
        .button:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        button:focus,
        button:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        a:focus,
        a:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        input:focus,
        input:focus-visible {
            outline: 2px solid #0066cc;
            outline-offset: 2px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        #menu {
            margin-top: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        #menu a {
            display: block;
            padding: 5px 0;
            color: #0066cc;
            text-decoration: none;
        }
        #menu a:hover {
            text-decoration: underline;
        }
        .clickable-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main id="main-content">
        <div class="container">
            <h1>Accessibility Test Page</h1>
            
            <!-- Fixed: Added alt text -->
            <div class="image-container">
                <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing a 300 by 200 pixel gray rectangle" />
            </div>
            
            <!-- Fixed: Added proper labels -->
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Username" />
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" />
                
                <input type="submit" value="Submit Registration" aria-label="Submit registration form" />
            </form>
            
            <!-- Fixed: Added aria-label and aria-hidden -->
            <div>
                <button class="button" id="confirmBtn" aria-label="Confirm">
                    <span class="icon" aria-hidden="true">✓</span>
                </button>
            </div>
            
            <!-- Fixed: Improved color contrast -->
            <p style="color: #595959;">This text has excellent contrast</p>
            
            <!-- Fixed: Used semantic heading -->
            <h2>This is now a proper heading</h2>
            
            <!-- Fixed: Added ARIA attributes and semantic nav element -->
            <div>
                <button id="menuToggle" aria-expanded="false" aria-controls="menu" aria-label="Toggle navigation menu">Menu</button>
                <nav id="menu" style="display: none;" aria-label="Main navigation">
                    <a href="#home">Home</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
            </div>
            
            <!-- Fixed: Changed to semantic button -->
            <button class="clickable-button" id="clickableBtn">
                Click me (now I'm a proper button)
            </button>
        </div>
    </main>
    
    <script>
        // Fixed: Moved to addEventListener
        document.getElementById('confirmBtn').addEventListener('click', function() {
            alert('Clicked');
        });
        
        // Menu toggle with focus management
        document.getElementById('menuToggle').addEventListener('click', function() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menuToggle');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            button.setAttribute('aria-expanded', !isExpanded);
            
            // Move focus to first link when opening
            if (!isExpanded) {
                const firstLink = menu.querySelector('a');
                if (firstLink) {
                    setTimeout(() => firstLink.focus(), 0);
                }
            }
        });
        
        // Keyboard event handling for menu toggle button
        document.getElementById('menuToggle').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                this.click();
            }
        });
        
        // Add Escape key to close menu
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const menu = document.getElementById('menu');
                const button = document.getElementById('menuToggle');
                if (button.getAttribute('aria-expanded') === 'true') {
                    menu.style.display = 'none';
                    button.setAttribute('aria-expanded', 'false');
                    button.focus();
                }
            }
        });
        
        document.getElementById('clickableBtn').addEventListener('click', function() {
            alert('Clicked!');
        });
    </script>
</body>
</html>
