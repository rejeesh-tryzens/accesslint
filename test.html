<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #ccc;
            color: #333;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="container" id="main-content" role="main">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing 300 by 200 pixel dimensions" />
        </div>
        
        <!-- Fixed: Added proper labels -->
        <form>
            <label for="username">
                Username
                <input type="text" id="username" name="username" placeholder="Username" />
            </label>
            <label for="email">
                Email
                <input type="email" id="email" name="email" placeholder="Email" />
            </label>
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Fixed: Added aria-label and aria-hidden -->
        <div>
            <button class="button" id="confirmBtn" aria-label="Confirm selection">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #767676;">This text has sufficient contrast</p>
        
        <!-- Fixed: Using proper heading element -->
        <h2>This is now a proper heading</h2>
        
        <!-- Fixed: Added ARIA attributes and semantic nav element, corrected link -->
        <div>
            <a href="/">Home</a>
            <button id="menuToggle" aria-expanded="false" aria-controls="menu">Menu</button>
            <nav id="menu" style="display: none;" aria-hidden="true" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        
        <!-- Fixed: Using semantic button element -->
        <button type="button" id="clickableBtn">
            Click me (now I'm a proper button)
        </button>
    </div>

    <script>
        // Fixed: Moved to external event listeners
        document.getElementById('confirmBtn').addEventListener('click', function() {
            alert('Clicked');
        });
        
        document.getElementById('menuToggle').addEventListener('click', function() {
            toggleMenu();
        });
        
        document.getElementById('clickableBtn').addEventListener('click', function() {
            handleClick();
        });
        
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.getElementById('menuToggle');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            menu.setAttribute('aria-hidden', isExpanded.toString());
            button.setAttribute('aria-expanded', (!isExpanded).toString());
        }
        
        function handleClick() {
            alert('Clicked!');
        }
    </script>
</body>
</html>
