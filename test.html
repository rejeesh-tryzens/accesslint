<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #ccc;
            color: #333;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accessibility Test Page</h1>
        
        <!-- Missing alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" />
        </div>
        <!--Add comment -->
        <!-- Form without proper labels -->
        <form>
            <input type="text" name="username" placeholder="Username" />
            <input type="email" name="email" placeholder="Email" />
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Button without accessible text -->
        <div>
            <button class="button" onclick="alert('Clicked')">
                <span class="icon">✓</span>
            </button>
        </div>
        
        <!-- Poor color contrast -->
        <p style="color: #ccc;">This text has poor contrast</p>
        
        <!-- Missing heading structure -->
        <div>
            <p style="font-size: 24px; font-weight: bold;">This looks like a heading but isn't</p>
        </div>
        
        <!-- Missing ARIA labels -->
        <div>
            <button onclick="toggleMenu()">Menu</button>
            <div id="menu" style="display: none;">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
        
        <!-- Non-semantic HTML -->
        <div onclick="handleClick()" style="cursor: pointer;">
            Click me (but I'm not a button)
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
        
        function handleClick() {
            alert('Clicked!');
        }
    </script>
</body>
</html>
