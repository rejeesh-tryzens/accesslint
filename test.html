<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button-style {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        button:focus, a:focus {
            outline: 3px solid #0066cc;
            outline-offset: 2px;
        }
        button:focus-visible, a:focus-visible {
            outline: 3px solid #0066cc;
            outline-offset: 2px;
        }
        #menu ul {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }
        #menu li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <main class="container" id="main-content">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="" role="presentation" />
        </div>
        
        <!-- Fixed: Added proper labels -->
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" />
            
            <button type="submit" class="button-style">Submit</button>
        </form>
        
        <!-- Fixed: Added aria-label and aria-hidden -->
        <div>
            <button class="button" onclick="alert('Clicked')" aria-label="Confirm selection">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #595959;">This text has sufficient contrast</p>
        
        <!-- Fixed: Using proper heading element -->
        <div>
            <h2>This is a proper heading</h2>
        </div>
        
        <!-- Fixed: Added ARIA attributes and nav element -->
        <div>
            <button onclick="toggleMenu()" aria-expanded="false" aria-controls="menu" aria-haspopup="menu">Menu</button>
            <nav id="menu" style="display: none;" aria-label="Main navigation">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
        
        <!-- Fixed: Using semantic button element -->
        <button onclick="handleClick()" class="button-style">
            Click me
        </button>
    </main>
    
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.querySelector('[aria-controls="menu"]');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            if (isExpanded) {
                menu.style.display = 'none';
                button.setAttribute('aria-expanded', 'false');
                button.focus();
            } else {
                menu.style.display = 'block';
                button.setAttribute('aria-expanded', 'true');
                // Focus first link in menu
                const firstLink = menu.querySelector('a');
                if (firstLink) firstLink.focus();
            }
        }
        
        function handleClick() {
            alert('Clicked!');
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const menu = document.getElementById('menu');
                const button = document.querySelector('[aria-controls="menu"]');
                if (button.getAttribute('aria-expanded') === 'true') {
                    menu.style.display = 'none';
                    button.setAttribute('aria-expanded', 'false');
                    button.focus();
                }
            }
        });
    </script>
</body>
</html>
