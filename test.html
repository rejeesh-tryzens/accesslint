<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        .clickable-button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="container" id="main-content">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing a 300 by 200 pixel gray rectangle" />
        </div>
        
        <!-- Fixed: Form with proper labels -->
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" />
            
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Fixed: Button with accessible text and aria-label -->
        <div>
            <button class="button" onclick="alert('Clicked')" aria-label="Confirm selection">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #767676;">This text has good contrast</p>
        
        <!-- Fixed: Proper heading structure -->
        <div>
            <h2>This is a proper heading</h2>
        </div>
        
        <!-- Fixed: Added ARIA attributes and semantic nav element -->
        <div>
            <button onclick="toggleMenu()" aria-expanded="false" aria-controls="menu" aria-label="Toggle navigation menu">Menu</button>
            <nav id="menu" style="display: none;" aria-hidden="true" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
        
        <!-- Fixed: Semantic button instead of div -->
        <button onclick="handleClick()" class="clickable-button">
            Click me
        </button>
    </div>
    
    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.querySelector('[aria-controls="menu"]');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            menu.setAttribute('aria-hidden', isExpanded);
            button.setAttribute('aria-expanded', !isExpanded);
        }
        
        function handleClick() {
            alert('Clicked!');
        }
    </script>
</body>
</html>
