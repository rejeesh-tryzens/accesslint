<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - AccessLint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .button {
            background-color: #0066cc;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0052a3;
        }
        .button:focus {
            outline: 2px solid #000;
            outline-offset: 2px;
        }
        .image-container {
            margin: 20px 0;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            display: block;
        }
        .link-button {
            background: none;
            border: none;
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            font-size: 1em;
        }
        .link-button:hover {
            color: #0052a3;
        }
        .link-button:focus {
            outline: 2px solid #000;
            outline-offset: 2px;
        }
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 100;
        }
        .skip-link:focus {
            top: 0;
        }
        .sr-only {
            position: absolute;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        nav {
            margin: 20px 0;
        }
        nav button {
            margin-bottom: 10px;
        }
        #menu {
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }
        #menu a {
            display: block;
            padding: 8px;
            color: #0066cc;
            text-decoration: none;
        }
        #menu a:hover {
            background-color: #e9e9e9;
        }
        #menu a:focus {
            outline: 2px solid #000;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="container" id="main-content">
        <h1>Accessibility Test Page</h1>
        
        <!-- Fixed: Added alt text -->
        <div class="image-container">
            <img src="https://via.placeholder.com/300x200" alt="Placeholder image showing 300x200 dimensions" />
        </div>
        
        <!-- Fixed: Added proper labels -->
        <form>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Username" />
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" />
            
            <input type="submit" value="Submit" />
        </form>
        
        <!-- Fixed: Added aria-label and aria-hidden for icon -->
        <div>
            <button class="button" onclick="showConfirmation()" aria-label="Confirm action">
                <span class="icon" aria-hidden="true">✓</span>
            </button>
        </div>
        
        <!-- Fixed: Improved color contrast -->
        <p style="color: #767676;">This text now has sufficient contrast</p>
        
        <!-- Fixed: Using proper heading element -->
        <h2>This is now a proper heading</h2>
        
        <!-- Fixed: Added ARIA attributes and proper navigation structure -->
        <nav>
            <a href="/checkout" aria-label="Proceed to checkout">Checkout</a>
            <button onclick="toggleMenu()" aria-expanded="false" aria-controls="menu" aria-label="Toggle navigation menu">Menu</button>
            <div id="menu" role="menu" style="display: none;">
                <a href="#home" role="menuitem">Home</a>
                <a href="#about" role="menuitem">About</a>
                <a href="#contact" role="menuitem">Contact</a>
            </div>
        </nav>
        
        <!-- Fixed: Using semantic button element -->
        <button onclick="handleClick()" class="link-button">
            Click me (now I'm a proper button)
        </button>
        
        <!-- Added: ARIA live region for announcements -->
        <div role="status" aria-live="polite" aria-atomic="true" class="sr-only" id="status-message"></div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.querySelector('[aria-controls="menu"]');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            menu.style.display = isExpanded ? 'none' : 'block';
            button.setAttribute('aria-expanded', !isExpanded);
        }
        
        function handleClick() {
            const status = document.getElementById('status-message');
            status.textContent = 'Action completed successfully';
            setTimeout(() => status.textContent = '', 3000);
        }
        
        function showConfirmation() {
            const status = document.getElementById('status-message');
            status.textContent = 'Action confirmed';
            setTimeout(() => status.textContent = '', 3000);
        }
    </script>
</body>
</html>
